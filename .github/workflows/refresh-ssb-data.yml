name: Refresh SSB data

on:
  schedule:
    - cron: "17 8 * * *"
      timezone: "Europe/Oslo"
  workflow_dispatch:

concurrency:
  group: ssb-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Check and propose official data update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download and validate the official snapshot
        run: python main.py --update-from-api --no-charts

      - name: Run the test suite
        run: python -m pytest -p no:cacheprovider

      - name: Detect versioned data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet --exit-code -- data_raw data_processed; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "The local snapshot is already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "A validated Statistics Norway update is ready for review." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the validated snapshot to the update branch
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          UPDATE_BRANCH: automation/ssb-data-update
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "refs/heads/$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git switch -C "$UPDATE_BRANCH" main
          git add data_raw data_processed
          git commit -m "data: refresh official ssb snapshot"
          git push --force-with-lease origin "$UPDATE_BRANCH"

      - name: Open or update the review pull request
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/ssb-data-update
        run: |
          title="data: refresh official SSB snapshot"
          body="Automated proposal containing a validated update from Statistics Norway table 14091.

          Validation completed before this pull request was updated:
          - official schema and source identity checks;
          - snapshot integrity verification;
          - complete automated test suite.

          Review the recorded additions and revisions in data_raw/source.json before merging."
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$UPDATE_BRANCH" --base main --state open --json number --jq '.[0].number')"

          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$UPDATE_BRANCH" --title "$title" --body "$body"
          fi
