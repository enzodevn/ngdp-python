name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Python quality
        if: matrix.python-version == '3.12'
        run: python -m ruff check . --output-format github

      - name: Check Python formatting
        if: matrix.python-version == '3.12'
        run: python -m ruff format --check .

      - name: Verify the raw snapshot fingerprint
        run: python -c "from src.provenance import validate_raw_snapshot; validate_raw_snapshot()"

      - name: Run the test suite
        run: python -m pytest -p no:cacheprovider

  workflows:
    name: Workflow definitions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate GitHub Actions workflows
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl --fail --silent --show-error --location \
            --output actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file actionlint.tar.gz actionlint
          ./actionlint -color

  postgresql:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ngdp_test
          POSTGRES_USER: ngdp
          POSTGRES_PASSWORD: ngdp_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ngdp -d ngdp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify PostgreSQL synchronization
        env:
          NGDP_TEST_DATABASE_URL: postgresql://ngdp:ngdp_test_password@localhost:5432/ngdp_test
        run: python -m pytest -p no:cacheprovider tests/test_database_integration.py

  container:
    name: API container
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate the local container topology
        env:
          NGDP_API_TOKEN: ci-only-token-with-at-least-32-characters
          NGDP_POSTGRES_PASSWORD: ci-only-database-password
        run: docker compose config --quiet

      - name: Build the API image
        run: docker build --tag ngdp-api:test .

      - name: Verify the container health contract
        shell: bash
        run: |
          docker run --detach \
            --name ngdp-api-test \
            --publish 127.0.0.1:8000:8000 \
            --env NGDP_API_TOKEN=ci-only-token-with-at-least-32-characters \
            ngdp-api:test

          cleanup() {
            docker logs ngdp-api-test || true
            docker rm --force ngdp-api-test || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health \
              | python -c "import json, sys; assert json.load(sys.stdin)['status'] == 'ok'"; then
              exit 0
            fi
            sleep 1
          done

          echo "The API container did not become healthy." >&2
          exit 1
